# PostgreSQL local para desenvolvimento (provider default do Tedros).
# Uso:
#   docker compose -f docker-compose-pg.yml up -d
#   ou: .\create-tedros-data.ps1 -Database postgres
# Depois suba o servidor com: mvn cargo:run  (profile db-postgres ativo por default)
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tedros-postgres-local
    restart: unless-stopped
    environment:
      - POSTGRES_USER=tdrs
      - POSTGRES_PASSWORD=xpto
      - POSTGRES_DB=tedros
    ports:
      - "5432:5432"
    volumes:
      - pg_data_local:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdrs -d tedros"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pg_data_local:
