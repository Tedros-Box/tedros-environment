server {
    listen 80;
    server_name h2db.tedros.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name h2db.tedros.test;

    ssl_certificate /etc/nginx/ssl/tedros.test+4.pem; 
    ssl_certificate_key /etc/nginx/ssl/tedros.test+4-key.pem; 

    location / {
        # Resolucao preguicosa (DNS interno do Docker): permite o nginx subir
        # mesmo quando o servico h2db nao existe (ex.: stack com --profile postgres).
        # Sem a variavel, o nginx resolve "h2db" no startup e aborta se nao existir.
        resolver 127.0.0.11 valid=30s;
        set $h2db_upstream http://h2db:81;
        proxy_pass         $h2db_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
    }
}
