apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Tedros-Postgres
    uid: tedros_pg
    type: postgres
    # servico 'postgres' do compose principal (profile postgres) na rede tedros-net
    url: postgres:5432
    database: tedros
    user: tdrs
    secureJsonData:
      password: "${TEDROS_DB_PASSWORD}"
    jsonData:
      sslmode: "disable"
      postgresVersion: 1600
