version: '3.8'

services:
  # Feature flag do banco via Compose profiles + env TEDROS_DB_*:
  #   docker compose --profile postgres --env-file .env.postgres up -d
  # Para outro vendor (ex. Oracle): criar servico com profiles: ["oracle"],
  # arquivo .env.oracle com TEDROS_DB_*, e init SQL em db/init-oracle.sql.
  # Defaults TEDROS_DB_* apontam para PostgreSQL (provider atual).
  tomee1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tedros-tomee1
    restart: always
    environment:
      - TZ=America/Sao_Paulo
      - JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8000
      - TEDROS_NODE_NAME=tomee1 # label 'node' das metricas Prometheus (por no)
      - REDIS_HOST=tedros-redis # Nome do container do Redis que será criado
      - REDIS_PORT=6379
      - TEDROS_DB_DRIVER=${TEDROS_DB_DRIVER:-org.postgresql.Driver}
      - TEDROS_DB_URL=${TEDROS_DB_URL:-jdbc:postgresql://postgres:5432/tedros?stringtype=unspecified}
      - TEDROS_DB_USER=${TEDROS_DB_USER:-tdrs}
      - TEDROS_DB_PASSWORD=${TEDROS_DB_PASSWORD:-xpto}
    ports:
      - "8000:8000" # JPDA debug port (tomee1)
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - tedros-net

  tomee2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tedros-tomee2
    restart: always
    environment:
      - TZ=America/Sao_Paulo
      - JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8001
      - TEDROS_NODE_NAME=tomee2 # label 'node' das metricas Prometheus (por no)
      - REDIS_HOST=tedros-redis # Nome do container do Redis que será criado
      - REDIS_PORT=6379
      - TEDROS_DB_DRIVER=${TEDROS_DB_DRIVER:-org.postgresql.Driver}
      - TEDROS_DB_URL=${TEDROS_DB_URL:-jdbc:postgresql://postgres:5432/tedros?stringtype=unspecified}
      - TEDROS_DB_USER=${TEDROS_DB_USER:-tdrs}
      - TEDROS_DB_PASSWORD=${TEDROS_DB_PASSWORD:-xpto}
    ports:
      - "8001:8001" # JPDA debug port (tomee2)
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - tedros-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: tedros-postgres
    restart: always
    profiles: ["postgres"]
    environment:
      - POSTGRES_USER=tdrs
      - POSTGRES_PASSWORD=xpto
      - POSTGRES_DB=tedros
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdrs -d tedros"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - tedros-net

  mongodb:
    image: mongo:8.0
    container_name: tedros-mongodb
    restart: always
    environment:
      - MONGO_INITDB_DATABASE=itsupport
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./nginx/ssl_local/mongodb.pem:/etc/ssl/mongodb.pem:ro
      # Novo mapeamento para a Autoridade Certificadora (CA) do mkcert
      - ./nginx/ssl_local/rootCA.pem:/etc/ssl/rootCA.pem:ro
    command:
      [
        "mongod",
        "--tlsMode",
        "requireTLS",
        "--tlsCertificateKeyFile",
        "/etc/ssl/mongodb.pem",
        # Informa a cadeia de confiança exigida pelo Mongo 8.0
        "--tlsCAFile",
        "/etc/ssl/rootCA.pem",
        # Permite que o Java e o Compass conectem sem precisar enviar um certificado de cliente
        "--tlsAllowConnectionsWithoutCertificates"
      ]
    networks:
      - tedros-net

  redis:
    image: redis:7-alpine
    container_name: tedros-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - tedros-net

  nginx:
    image: nginx:latest
    container_name: tedros-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Produção
      # - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # - ./nginx/ssl:/etc/letsencrypt:ro
      # Local tests (mkcert)
      - ./nginx/conf.d.local:/etc/nginx/conf.d:ro
      - ./nginx/ssl_local:/etc/nginx/ssl:ro
    depends_on:
      - tomee1
      - tomee2
    networks:
      - tedros-net

volumes:
  pg_data:
  mongo_data:

networks:
  tedros-net:
    driver: bridge
    # nome fixo p/ o compose de observabilidade anexar como 'external' (dev)
    name: tedros-net
